[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "todo-txt-gtd"
version = "0.13"
description = "Todo.txt support scripts for GTD"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [ { name = "David Steele", email = "steele@debian.org" } ]
keywords = [ "utilities", "command-line", "todo", "todo list", "todo.txt" ]
classifiers = [
    "Environment :: Console",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Other/Nonlisted Topic",
]

[project.scripts]
gtdcleanup = "todo_txt_gtd.tdtcleanup:main"
project = "todo_txt_gtd.tdtproj:main"
counttodo = "todo_txt_gtd.tdtcount:main"

[project.urls]
Homepage = "https://github.com/davesteele/todo.txt-gtd"
Source = "https://github.com/davesteele/todo.txt-gtd.git"
Issues = "https://github.com/davesteele/todo.txt-gtd/issues"
Changelog = "https://raw.githubusercontent.com/davesteele/todo.txt-gtd/refs/heads/main/debian/changelog"


[tool.poetry]
package-mode = true
packages = [
    {include = "todo_txt_gtd"},
]

[tool.poetry.group.dev.dependencies]
pytest="*"

[tool.poetry.group.test.dependencies]
pytest = "*"


[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = [ "todo_txt_gtd", "test" ]
pythonpath = [ ".", ]

[tool.ruff]
line-length = 79
indent-width = 4

